# One-off diagnostic — manual trigger only.
# File location:  .github/workflows/probe3.yml

name: Probe 3 - The Nation sitemap

on:
  workflow_dispatch:

jobs:
  probe3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python probe3.py
